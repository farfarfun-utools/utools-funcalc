name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check and build
        run: sh build.sh
      - name: Verify runner browser
        if: runner.os == 'Linux'
        run: google-chrome --version
      - name: Install font for Chinese screenshots
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fL --retry 2 --max-time 60 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -o ~/.local/share/fonts/NotoSansCJKsc-Regular.otf
          fc-cache -f
      - name: Browser regression tests
        if: runner.os == 'Linux'
        run: pnpm test:e2e
      - name: Upload screenshots and traces
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: funcalc-browser-checks
          path: test-results/
          if-no-files-found: warn
      - name: Prepare developer directory
        if: runner.os == 'Linux'
        run: cp docs/developer-install.md utools/README.md
      - name: Upload developer files (not an installer)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: utools-funcalc-developer-files
          path: |
            utools/plugin.json
            utools/preload.js
            utools/logo.png
            utools/README.md
            utools/dist/
          if-no-files-found: error
      - name: Check project ID and organization packaging secrets
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        id: upxs-config
        env:
          UTOOLS_MID: ${{ secrets.UTOOLS_MID }}
          UTOOLS_UID: ${{ secrets.UTOOLS_UID }}
          UTOOLS_CELLPHONE: ${{ secrets.UTOOLS_CELLPHONE }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const identity = JSON.parse(readFileSync('identity.json', 'utf8'));
          if (identity.pluginId && ['UTOOLS_MID', 'UTOOLS_UID', 'UTOOLS_CELLPHONE'].every(key => process.env[key])) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'enabled=true\n');
          } else {
            console.log('::notice::UPXS packaging awaits the target pluginId in identity.json and the three organization secrets.');
          }
          JS
      - name: Package UPXS with shared tooling
        if: steps.upxs-config.outputs.enabled == 'true'
        uses: farfarfun-action/utools-devtools@c48e8ce06b6700d21c73917b3b16d6e5674c13ef # v0.1.4
        with:
          source: utools
          output: release/utools-funcalc.upxs
          identity-file: identity.json
          mid: ${{ secrets.UTOOLS_MID }}
          uid: ${{ secrets.UTOOLS_UID }}
          cellphone: ${{ secrets.UTOOLS_CELLPHONE }}
      - name: Checksum UPXS
        if: steps.upxs-config.outputs.enabled == 'true'
        run: cd release && sha256sum utools-funcalc.upxs > SHA256SUMS
      - name: Upload UPXS package
        if: steps.upxs-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: utools-funcalc-upxs
          path: release/
          if-no-files-found: error
