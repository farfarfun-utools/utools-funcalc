name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify tag
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Check organization packaging secrets
        env:
          UTOOLS_MID: ${{ secrets.UTOOLS_MID }}
          UTOOLS_UID: ${{ secrets.UTOOLS_UID }}
          UTOOLS_CELLPHONE: ${{ secrets.UTOOLS_CELLPHONE }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          for (const key of ['UTOOLS_MID', 'UTOOLS_UID', 'UTOOLS_CELLPHONE']) {
            if (!process.env[key]) throw new Error(`Missing organization secret: ${key}`);
          }
          if (!JSON.parse(readFileSync('identity.json', 'utf8')).pluginId) throw new Error('Missing target pluginId');
          JS
      - run: sh build.sh
      - run: google-chrome --version
      - run: pnpm test:e2e
      - name: Set package filename
        run: |
          version=$(node -p "require('./package.json').version")
          echo "UPXS_NAME=utools-funcalc-${version}.upxs" >> "$GITHUB_ENV"
          echo "UPXS_FILE=release/utools-funcalc-${version}.upxs" >> "$GITHUB_ENV"
      - name: Package and verify UPXS
        uses: farfarfun-action/utools-devtools@013ce692f286b3c209f2841ad6fa50408ca153db # v0.1.3
        with:
          source: utools
          output: ${{ env.UPXS_FILE }}
          identity-file: identity.json
          mid: ${{ secrets.UTOOLS_MID }}
          uid: ${{ secrets.UTOOLS_UID }}
          cellphone: ${{ secrets.UTOOLS_CELLPHONE }}
      - name: Checksum package
        run: cd release && sha256sum "$UPXS_NAME" > SHA256SUMS
      - name: Publish installation preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$UPXS_FILE" release/SHA256SUMS --verify-tag --prerelease --title "$GITHUB_REF_NAME · UPXS 安装测试版" --notes-file docs/release-upxs.md
